[pytest]
# Dossier de tests
testpaths = tests

# ── CORRECTION CRITIQUE ───────────────────────────────────────────────────────
# Ajoute la racine du projet (.) au sys.path de Python.
# Sans ça, pytest ne trouve pas le package src/ lors des imports.
# Disponible depuis pytest 7.0 — tu as pytest 9.1.1 ✅
pythonpath = .

# Affichage détaillé par défaut
addopts = -v --tb=short

# Encodage pour Windows
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning

